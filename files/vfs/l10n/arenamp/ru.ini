chargen.tutorial.text = #E8C878ДОБРО ПОЖАЛОВАТЬ В ARENAMP#FFFFFF\nArenaMP - многопользовательский Morrowind на базе TES3MP/EncoreMP и свежих наработок OpenMW. Это не просто совместное прохождение: сервер синхронизирует игроков, бой, многие предметы, квестовые состояния и дополнительные системы ArenaMP.\nПравила конкретного сервера могут отличаться. Если локальная настройка конфликтует с серверной, приоритет имеет сервер.\n\n#E8C878С ЧЕГО НАЧАТЬ#FFFFFF\nСоздайте персонажа: выберите расу и внешность, затем класс и знак рождения. Окно Подробнее о расе показывает стартовые характеристики, навыки и способности.\nКласс задаёт специализацию, основные атрибуты и профильные навыки. Пара основных атрибутов формирует архетип ArenaMP с собственными сильными сторонами и ограничениями.\nПосле создания персонажа осмотритесь, проверьте клавиши управления, голос и интерфейс. Для совместной игры откройте меню игрока и создайте или примите группу.\n\n#E8C878РАЗВИТИЕ, XP И УРОВНИ#FFFFFF\nArenaMP использует серверное развитие. XP выдаётся за поддерживаемые игровые действия, исследования, квестовые стадии, убийства и другие источники. Новый уровень не требует сна.\nУровни дают очки развития, а навыки также продолжают расти от использования. Повторный фарм одной и той же цели постепенно становится менее выгодным.\nСмерть может снять незакреплённый XP текущего уровня, но уже полученные уровни и изученные навыки не исчезают.\nВыносливость важна: при низком запасе сил физический и магический урон игрока уменьшается. Выносливость также расходуется активной защитой.\n\n#E8C878СЕРВЕРНЫЕ ПРАВИЛА И АНТИЧИТ#FFFFFF\nКлючевые характеристики, развитие и часть боевых правил проверяются сервером. Локальная подмена значений не должна давать преимущество: при расхождении сервер использует подтверждённое состояние.\nАнтичит работает как защитная система и не должен засыпать игрока техническими сообщениями. Если после обновления персонажа что-то выглядит неверно, переподключитесь и приложите логи к отчёту.\n\n#E8C878БОЕВОЙ БАЛАНС#FFFFFF\nВ PvE потолок урона за один удар или применение атакующего заклинания зависит от разницы уровней: 10-60% максимального HP цели. При равных уровнях — 35%, атакующий ниже на 50 уровней — 10%, выше на 50 — 60%. Правило действует как для игрока против NPC/существа, так и для NPC/существа против игрока.\nВсе эффекты одного атакующего заклинания делят общий лимит урона с учётом полной длительности. Физический удар, зачарование при попадании, яд и стихийный бонус класса тоже делят один бюджет.\nЛимит — верхняя граница, а не гарантированный урон. Оружие, навыки, броня, сопротивления, выносливость, защита существ и комбо продолжают работать. Раненого противника можно добить; для PvP действует отдельное правило.\nСущества бьют с разной скоростью в зависимости от уровня: от 0,5× у самых слабых до 1,5× к 50 уровню, и между ударами отдыхают соответственно меньше. NPC и игроков это не касается.\nСветоч (эффект “Свет”) и Убежище (Sanctuary) дают шанс полностью увернуться от физического удара или стрелы: 0,6% за единицу Света и 1% за единицу Убежища, вместе не больше 35%. Усталость снижает шанс, а лёжа или в параличе увернуться нельзя. От заклинаний уклонение не спасает.\n\n#E8C878ОРУЖИЕ, ACTIVE GUARD И ПАРИРОВАНИЕ#FFFFFF\nКлавиши ниже указаны для стандартной раскладки ПК и могут быть переназначены.\nКороткий F достаёт или убирает оружие. Удержание F с подходящей экипировкой поднимает Active Guard. Лук и арбалет не считаются щитом.\nЩит блокирует лучше оружия и рук. Точное парирование требует навыка и правильного момента, зато способно полностью остановить физический удар, яд и зачарование при попадании.\nЗащита работает спереди и расходует выносливость. После тяжёлого блока возможно короткое окно уязвимости. Опытные NPC умеют отходить, смещаться в сторону, преследовать и использовать окна для контратаки.\nДаже без поднятой защиты обнажённые щит или оружие иногда блокируют удар сами. Шанс растёт вместе с защитой — навыком (Блок; для оружия — навык оружия вместе с Блоком) и рейтингом брони: до 25% со щитом, до 15% с оружием и до 8% голыми руками. Такой блок слабее поднятого: не бывает точным парированием, тратит выносливость, работает только спереди и не срабатывает, пока вы сами атакуете. Стрелы сам по себе ловит только щит.\n\n#E8C878МАГИЯ#FFFFFF\nВыберите заклинание или зачарованный предмет. Короткий R со свободной левой рукой выполняет быстрый каст левой рукой. Щит, факел или двуручное оружие могут помешать.\nВременные заклинания, зелья, усиления и отрицательные эффекты с таймером отображаются справа над полосой выносливости. Карточка остаётся в стеке до окончания эффекта, а оставшееся время обновляется постоянно.\nУдержание R готовит магию. В подготовленной стойке используется обычный каст. Повторный R помогает убрать подготовленную магию после завершения текущего действия.\nReflect принадлежит цели заклинания. Уже отражённый эффект не отражается бесконечно между персонажами. Spell Absorption может остановить отражённый эффект, но не должен создавать бесконечную магию.\nНачиная примерно с 30 уровня магически ориентированные NPC могут иметь врождённый шанс отражения вредных заклинаний; шанс растёт с уровнем и складывается с обычными источниками Reflect.\n\n#E8C878ПРИЗЫВ И ВРЕМЕННОЕ СНАРЯЖЕНИЕ#FFFFFF\nОдновременно можно поддерживать от 1 до 10 призванных существ. Лимит зависит от базовых Интеллекта и Колдовства: 1 + floor(9 x min(Интеллект, Колдовство) / 100), максимум 10.\nВременные усиления не повышают лимит. Если мест нет, новый призыв ждёт свободного слота только пока действует исходный эффект.\nПризванные существа наносят 80% обычного физического и прямого магического урона, оставаясь сильной поддержкой, но не полной заменой игрока.\nПризванные оружие и броню нельзя выбросить, передать или спрятать в контейнер: это временное снаряжение.\n\n#E8C878ГРУППА И СОВМЕСТНАЯ ИГРА#FFFFFF\nМеню группы позволяет приглашать игроков, исключать участников и передавать лидерство. Для некоторых систем можно отдельно включать синхронизацию журнала и диалоговых тем.\nXP за совместные действия может распределяться между подходящими участниками группы в одной ячейке. Маркеры группы можно отображать на карте.\nПриглашения и действия группы подтверждайте осознанно: синхронизация влияет на совместное прохождение.\n\n#E8C878ГОЛОСОВОЙ ЧАТ#FFFFFF\nЛокальный голос предназначен для игроков рядом; стандартная клавиша ПК - V. Групповой голос связывает участников группы независимо от расстояния.\nНа Android микрофон работает как переключатель. Во время разговора тонкая зелёная рамка показывает передачу голоса.\nВ настройках доступны громкость голосового чата, усиление собственного микрофона и обработка голоса. Во время речи игра может автоматически приглушать музыку и эффекты, чтобы голос был разборчивее.\n\n#E8C878ЧАТ И МЕНЮ ИГРОКА#FFFFFF\nЧат поддерживает несколько режимов общения, включая локальные RP/OOC-варианты Say, Whisper и Shout.\nПо умолчанию короткое Y открывает компактный ввод, удержание Y - меню игрока. В меню доступны игроки, группа, профиль, недвижимость и другие серверные функции.\n\n#E8C878СПИСОК СЕРВЕРОВ И ЛОКАЛЬНАЯ ИГРА#FFFFFF\nЛаунчер показывает опубликованные ArenaMP-серверы и сведения, которые отправляет хост. Для закрытой компании можно запускать локальный сервер и задавать имя, пароль, лимит игроков и режим публикации.\nЕсли сервер не виден в списке, это не всегда означает, что он выключен: проверьте публикацию, сетевую доступность и актуальность клиента/протокола.\n\n#E8C878ДОМА И ЛИЧНЫЕ ИНСТАНСЫ#FFFFFF\nДоступный дом показывает цену покупки. По умолчанию игрок может владеть одним домом. Личный инстанс отделён от общей ячейки, поэтому ваши изменения не обязаны мешать другим игрокам.\nВладелец может управлять доступом друзей и совладельцев, разрешениями на предметы и другими настройками. Доверенные персонажи могут получать особый доступ к закрытым дверям дома.\nНесколько внутренних помещений могут быть объединены в одну недвижимость. При продаже дом очищается по серверным правилам и возвращает только предусмотренную часть стоимости.\nКниги и записки в защищённом доме можно читать без права украсть предмет; контейнеры при запрете владельца открываться не должны.\n\n#E8C878МЕБЕЛЬ, ДЕКОР И ВИТРИНЫ#FFFFFF\nВ собственном доме удерживайте активацию на подходящем предмете или мебели, чтобы открыть действия. Доступны перемещение, возврат в инвентарь, удаление и связанные серверные функции.\nВ режиме размещения можно двигать, вращать и точно позиционировать предмет. На Android управление адаптировано под экранные элементы.\nВитрины позволяют назначить цену предмету. Пока цена активна или предмет персонально заблокирован, обычное взятие ограничено. Выручка хранится отдельно и забирается владельцем.\n\n#E8C878КВЕСТЫ И ПЕРСОНАЛЬНЫЕ ПРЕДМЕТЫ#FFFFFF\nArenaMP старается сохранять совместимость квестов в мультиплеере. Часть важных квестовых предметов может быть персональной: если другой игрок уже забрал свою копию, источник остаётся доступен тем, кто ещё не получил предмет.\nНе рассчитывайте на дюп через выбрасывание персональных квестовых вещей: сервер отслеживает выдачу. Некоторые квесты и скрипты в мультиплеере могут вести себя иначе, чем в одиночной игре.\n\n#E8C878ТОРГОВЛЯ, ПРЕДМЕТЫ И РЕМЕСЛО#FFFFFF\nТорговля и цены зависят от навыков, отношения и серверных правил. Проверяйте стоимость перед подтверждением сделки.\nВ ArenaMP есть система написания собственных книг и свитков при наличии необходимых материалов. Созданные записи можно читать, копировать и редактировать по правилам системы.\nТребования к экипировке и часть балансных коэффициентов задаются сервером и не обходятся локальным settings.cfg.\n\n#E8C878ЗАЩИТА ЭКОНОМИКИ И XP#FFFFFF\nСервер отслеживает ряд повторных действий, чтобы один и тот же контейнер, квестовый предмет или искусственно возвращённый предмет нельзя было бесконечно использовать для получения опыта или копий.\nЕсли действие выглядит выгоднее обычного из-за рассинхронизации, не рассчитывайте на сохранение результата: серверное состояние считается главным.\n\n#E8C878ПОТЕРЯ СОЗНАНИЯ, СМЕРТЬ И ВОЗРОЖДЕНИЕ#FFFFFF\nПотерявшего сознание союзника можно поднять подходящим восстановлением здоровья. В некоторых случаях собственное зелье также позволяет прийти в себя. Между повторными поднятиями действует защита от злоупотребления.\nПри высокой награде за голову смерть может увеличить время ожидания возрождения. Перезаход не предназначен для обхода серверного таймера.\n\n#E8C878СОЕДИНЕНИЕ И ВОССТАНОВЛЕНИЕ#FFFFFF\nПри кратком разрыве связи ArenaMP пытается восстановить соединение примерно до 30 секунд и показывает прогресс. Не закрывайте игру до результата, если хотите сохранить текущую сессию.\nНа ПК при переходах между ячейками последний игровой кадр может оставаться на экране с полосой загрузки. На Android используется безопасный чёрный переход, чтобы уменьшить проблемы мобильного рендера и памяти.\n\n#E8C878КАМЕРА, ИНВЕНТАРЬ И ANDROID#FFFFFF\nКороткий TAB переключает вид. Удержание TAB в третьем лице используется для осмотра персонажа в поддерживаемом режиме камеры.\nВ инвентаре выбирайте оружие, броню, магию и расходники; глобальная и локальная карты имеют отдельное поведение. На Android доступны экранные кнопки и редактор управления.\nЕсли интерфейс или курсор ведут себя неудобно, сначала проверьте настройки управления и масштаб UI.\n\n#E8C878ИНТЕРФЕЙС И HUD#FFFFFF\nНад персонажами игроков отображается имя без уровня; уровень предназначен для NPC и существ. Боевые полосы здоровья помогают следить за целями, а близкие цели могут переходить в компактный стек у нижней части HUD.\nСправа над выносливостью находятся уведомления о предметах, опыте и временных магических эффектах. Эффект с длительностью не исчезает из стека раньше времени: оставшиеся секунды обновляются до окончания или рассеивания.\nПодсказки загрузки напоминают о серверных механиках, управлении и кооперативных функциях; они не заменяют этот полный туториал.\n\n#E8C878СЕРВЕРНЫЕ ПРАВИЛА И ЗАЩИТА ПРОГРЕССА#FFFFFF\nКритичные характеристики, развитие и часть боевой логики проверяются сервером. Не пытайтесь усиливать персонажа изменением локальных файлов: серверные значения имеют приоритет и могут восстановить подтверждённое состояние.\nArenaMP старается делать такие проверки незаметно для обычного игрока. Если после обновления что-то выглядит неправильно, перезапустите клиент и приложите логи к отчёту.\n\n#E8C878ПРОИЗВОДИТЕЛЬНОСТЬ#FFFFFF\nArenaMP использует дополнительные эффекты, анимации, голос и сетевую синхронизацию. Если FPS нестабилен, начните с дальности, теней, травы, качества материалов и постобработки.\nНе увеличивайте мобильные лимиты памяти без необходимости: Android сильнее зависит от конкретного GPU и объёма RAM.\n\n#E8C878ПОМОЩЬ И ОТЧЁТЫ ОБ ОШИБКАХ#FFFFFF\nПомощь и сообщество: t.me/arena_mp\nПри сообщении об ошибке укажите платформу, версию клиента, сервер, последовательность действий и ожидаемый результат. По возможности приложите tes3mp-client.log, серверный лог или снимок экрана.\nНе публикуйте пароли, токены и другие личные данные.


