archetype.fire_warrior.name = Воин огня
archetype.fire_warrior.buff = Пылающий клинок: Сила + Интеллект восстанавливают магию и добавляют растущий огненный урон к ударам оружием.
archetype.fire_warrior.debuff = Магическая обуза: средняя и тяжёлая броня всё сильнее замедляет движение и восстановление запаса сил.
archetype.crusader.name = Крестоносец
archetype.crusader.buff = Рвение: Сила + Сила воли ускоряют восстановление здоровья, повышают надёжность заклинаний и сопротивление параличу.
archetype.crusader.debuff = Тяжёлая доктрина: с ростом пары снижается общая подвижность.
archetype.weaponmaster.name = Мастер оружия
archetype.weaponmaster.buff = Идеальная техника: Сила + Ловкость повышают урон оружием и точность.
archetype.weaponmaster.debuff = Решительная атака: наступательная манера делает входящие удары опаснее.
archetype.barbarian.name = Варвар
archetype.barbarian.buff = Напор: Сила + Скорость дают высокий урон оружием и скорость передвижения.
archetype.barbarian.debuff = Нетерпение: заклинания становятся менее надёжными.
archetype.warrior.name = Воин
archetype.warrior.buff = Оплот: Сила + Выносливость повышают грузоподъёмность и снижают входящий урон.
archetype.warrior.debuff = Вес стали: скорость передвижения немного снижена.
archetype.knight.name = Рыцарь
archetype.knight.buff = Властное присутствие: Сила + Привлекательность повышают урон оружием и отношение окружающих.
archetype.knight.debuff = Церемониальная ноша: запас сил восстанавливается медленнее.
archetype.champion.name = Чемпион
archetype.champion.buff = Удача любит смелых: Сила + Удача повышают урон, точность и сопротивление параличу.
archetype.champion.debuff = Искатель славы: средняя и тяжёлая броня всё сильнее ограничивает подвижность.
archetype.mage.name = Маг
archetype.mage.buff = Глубокий резерв: Интеллект + Сила воли заметно восстанавливают магию и улучшают колдовство.
archetype.mage.debuff = Магическая хрупкость: получаемый физический урон увеличен.
archetype.witchhunter.name = Охотник на ведьм
archetype.witchhunter.buff = Расчётливая охота: Интеллект + Ловкость улучшают магию и точность и позволяют чувствовать зачарования поблизости.
archetype.witchhunter.debuff = Постоянная настороженность: восстановление запаса сил снижено.
archetype.nightblade.name = Клинок ночи
archetype.nightblade.buff = Теневая вуаль: Интеллект + Скорость улучшают подвижность и магию; скрытность даёт Ночное зрение и слабый Хамелеон.
archetype.nightblade.debuff = Стеклянное лезвие: входящий урон увеличен.
archetype.sorcerer.name = Чародей
archetype.sorcerer.buff = Связанный резерв: Интеллект + Выносливость восстанавливают магию и дают растущее Поглощение заклинаний.
archetype.sorcerer.debuff = Размеренный шаг: скорость передвижения снижена.
archetype.bard.name = Бард
archetype.bard.buff = Серебряный язык: Интеллект + Привлекательность улучшают восстановление магии, торговлю и отношение.
archetype.bard.debuff = Мягкие руки: урон оружием снижен.
archetype.artificer.name = Артефактор
archetype.artificer.buff = Вдохновенная конструкция: Интеллект + Удача улучшают магию, переноску, торговлю и обнаружение зачарований.
archetype.artificer.debuff = Избыточная подготовка: сложное снаряжение снижает скорость движения.
archetype.monk.name = Монах
archetype.monk.buff = Сосредоточенное движение: Сила воли + Ловкость повышают уклонение и восстановление сил; без средней/тяжёлой брони дают Святилище.
archetype.monk.debuff = Дисциплина без брони: средняя и тяжёлая броня заметно снижает скорость движения.
archetype.spellsword.name = Клинок заклятий
archetype.spellsword.buff = Поток: Сила воли + Скорость повышают движение и надёжность заклинаний.
archetype.spellsword.debuff = Колдовство в броне: средняя и тяжёлая броня всё сильнее замедляет восстановление запаса сил.
archetype.templar.name = Храмовник
archetype.templar.buff = Священная стойкость: Сила воли + Выносливость восстанавливают здоровье, улучшают магию, снижают урон и дают сопротивление магии.
archetype.templar.debuff = Непоколебимость: скорость передвижения снижена.
archetype.healer.name = Целитель
archetype.healer.buff = Милосердный дух: Сила воли + Привлекательность восстанавливают здоровье/магию, улучшают отношение и сопротивление болезням.
archetype.healer.debuff = Привычка к миру: урон оружием снижен.
archetype.oracle.name = Провидец
archetype.oracle.buff = Предчувствие: Сила воли + Удача улучшают магию/уклонение и позволяют чувствовать существ и ключи поблизости.
archetype.oracle.debuff = Отрешённость от мирского: грузоподъёмность снижена.
archetype.thief.name = Вор
archetype.thief.buff = Шаг в тени: Ловкость + Скорость улучшают движение/уклонение; в скрытности растущий Хамелеон скрывает вора.
archetype.thief.debuff = Нет права на ошибку: входящий урон увеличен.
archetype.scout.name = Разведчик
archetype.scout.buff = Походная выучка: Ловкость + Выносливость улучшают движение/силы/стойкость и позволяют чувствовать существ поблизости.
archetype.scout.debuff = Практичный ум: надёжность заклинаний снижена.
archetype.agent.name = Агент
archetype.agent.buff = Социальная пластика: Ловкость + Привлекательность улучшают уклонение, торговлю и отношение.
archetype.agent.debuff = Непрямой бой: урон оружием снижен.
archetype.trickster.name = Трикстер
archetype.trickster.buff = Невозможный угол: Ловкость + Удача повышают точность и уклонение.
archetype.trickster.debuff = Любитель риска: входящий урон увеличен.
archetype.ranger.name = Следопыт
archetype.ranger.buff = Долгий марш: Скорость + Выносливость улучшают движение/силы/реген здоровья и позволяют чувствовать существ поблизости.
archetype.ranger.debuff = Идти налегке: грузоподъёмность снижена.
archetype.rogue.name = Плут
archetype.rogue.buff = Быстрая сделка: Скорость + Привлекательность улучшают движение и общение; скрытность даёт лёгкую вуаль Хамелеона.
archetype.rogue.debuff = Слабая защита: входящий урон увеличен.
archetype.duelist.name = Дуэлянт
archetype.duelist.buff = Счастливый темп: Скорость + Удача повышают движение, точность и урон оружием.
archetype.duelist.debuff = Свобода движений: средняя и тяжёлая броня всё сильнее замедляет передвижение.
archetype.pilgrim.name = Пилигрим
archetype.pilgrim.buff = Надёжный путник: Выносливость + Привлекательность восстанавливают здоровье, улучшают переноску/торговлю и сопротивление болезням.
archetype.pilgrim.debuff = Простая вера: надёжность заклинаний снижена.
archetype.survivor.name = Выживший
archetype.survivor.buff = Второе дыхание: Выносливость + Удача восстанавливают здоровье/силы, уменьшают урон и дают сопротивление яду и болезням.
archetype.survivor.debuff = Осторожный шаг: скорость движения снижена.
archetype.adventurer.name = Авантюрист
archetype.adventurer.buff = Удачливый универсал: Привлекательность + Удача улучшают движение, точность, торговлю и отношение.
archetype.adventurer.debuff = Мастер на все руки: урон оружием и надёжность заклинаний немного снижены.
