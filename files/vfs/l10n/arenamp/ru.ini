house.container.access.denied = Владелец запретил открывать контейнеры в этом доме.

loading.tip.1 = Навык школы магии влияет на стоимость создания заклинаний: развивайте нужные школы.
loading.tip.2 = В многоэффектном заклинании цена рассчитывается для каждого эффекта отдельно.
loading.tip.3 = Сила, длительность и область эффекта напрямую увеличивают стоимость заклинания.
loading.tip.4 = Следы зависят от поверхности под ногами и постепенно исчезают.
loading.tip.5 = Смена языка интерфейса меняет и язык загрузочных подсказок.
loading.tip.6 = Свободный дом можно купить, удерживая "Взять/Активировать" на его двери.
loading.tip.7 = Короткое нажатие на дверь остаётся обычным входом; удержание вызывает логику недвижимости.
loading.tip.8 = Управление своей недвижимостью находится во вкладке "Мой дом" меню игрока.
loading.tip.9 = Владелец может переименовать объект и выбрать тип: дом, таверна, магазин или гильдия.
loading.tip.10 = Совладелец может обустраивать дом и управлять предметами, не становясь новым владельцем.
loading.tip.11 = Друзьям можно дать доступ в дом без передачи им прав совладельца.
loading.tip.12 = Владелец может отдельно разрешить или запретить гостям забирать предметы.
loading.tip.13 = Владелец, совладелец и друг считаются доверенными и могут входить через закрытую дверь дома.
loading.tip.14 = Личный инстанс дома отделён от общей ячейки: ваши изменения не мешают другим игрокам.
loading.tip.15 = После 30 дней аккаунта контейнеры в собственном доме могут работать без лимита вместимости.
loading.tip.16 = При продаже недвижимости возвращается только часть её стоимости.
loading.tip.17 = Удерживайте "Взять" на переносимом предмете в своей недвижимости, чтобы открыть действия.
loading.tip.18 = Для предмета доступны перемещение, цена, взятие в инвентарь и персональный замок.
loading.tip.19 = Цена витрины задаётся за весь предмет или всю стопку, а не за одну единицу.
loading.tip.20 = Назначать и снимать цену с выставленного предмета может владелец недвижимости.
loading.tip.21 = Покупатель подтверждает покупку выставленного предмета обычной активацией.
loading.tip.22 = Свою выставленную вещь нельзя забрать, пока с неё не снята цена.
loading.tip.23 = Заблокированный предмет нельзя перемещать или покупать - сначала снимите персональный замок.
loading.tip.24 = Выручка от продаж хранится отдельно; забрать её можно кнопкой "Выручка".
loading.tip.25 = При передаче дома старые цены не продолжают начислять золото прежнему владельцу.
loading.tip.26 = Магазин мебели доступен из меню декораций и хранит купленные предметы отдельно.
loading.tip.27 = Размещать и убирать мебель могут владелец и совладельцы подходящего дома.
loading.tip.28 = Удержание "Взять" на мебели открывает компактное меню: перемещение, в инвентарь или удаление.
loading.tip.29 = Короткое нажатие "Взять" не запускает редактор: сундуки, кровати и предметы работают обычно.
loading.tip.30 = В режиме размещения клавиши движения двигают предмет, а Shift включает точную подстройку.
loading.tip.31 = Удерживайте кнопку оружия в режиме размещения, чтобы вращать предмет.
loading.tip.32 = Кнопка магии в режиме размещения переключает ось вращения X - Y - Z.
loading.tip.33 = Колесо мыши меняет расстояние до предмета; средняя кнопка меняет вид.
loading.tip.34 = Ctrl выравнивает предмет перед персонажем, а привязка помогает поставить его на поверхность.
loading.tip.35 = Повторное нажатие "Взять/Активировать" завершает размещение предмета.
loading.tip.36 = Группу можно создать и настроить прямо в меню игрока.
loading.tip.37 = Лидер группы может приглашать игроков, исключать их и передавать лидерство.
loading.tip.38 = Опыт за убийства и квесты делится между участниками группы онлайн в одной ячейке.
loading.tip.39 = Синхронизацию журнала группы можно включать и выключать отдельно.
loading.tip.40 = Синхронизацию диалоговых тем группы также можно включать отдельно.
loading.tip.41 = "Голос группы" связывает участников вашей группы независимо от расстояния между ними.
loading.tip.42 = Даже при включённом голосе группы клавиша V остаётся локальным голосом для игроков рядом.
loading.tip.43 = Состояние группового голосового канала сохраняется между игровыми сессиями.
loading.tip.44 = На Android микрофон работает как переключатель: нажмите для включения и ещё раз для выключения.
loading.tip.45 = Во время передачи голоса тонкая зелёная рамка показывает, что микрофон активен.
loading.tip.46 = Потерявшего сознание сопартийца можно поднять зельем восстановления здоровья.
loading.tip.47 = "Восстановить здоровье" касанием тоже может поднять потерявшего сознание сопартийца.
loading.tip.48 = Если вы без сознания, собственные зелья восстановления здоровья позволяют подняться самостоятельно.
loading.tip.49 = При личном штрафе от 1000 смерть погашает его и добавляет время ожидания за каждую полную тысячу.
loading.tip.50 = Таймер штрафного возрождения идёт только пока вы онлайн; перезаход его не сбрасывает.
loading.tip.51 = На карте можно включить видимость маркеров для участников группы.
loading.tip.52 = Y: короткое нажатие открывает быстрый ввод чата, удержание - меню игрока.
loading.tip.53 = В чате доступны RP/OOC и локальные режимы Say, Whisper и Shout.
loading.tip.54 = Сила архетипа растёт вместе с двумя его основными атрибутами.
loading.tip.55 = У архетипов есть бонусы и условные штрафы - учитывайте их при выборе экипировки и стиля игры.
loading.tip.56 = У некоторых наставников действует лимит тренировок до перезапуска сервера.
loading.tip.57 = В профиле доступны точки возврата, которые постепенно открываются с ростом уровня.
loading.tip.58 = В меню профиля видны время в игре, смерти, аресты, уровень и точки возврата.
loading.tip.59 = В меню "Игроки" можно выбрать персонажа и быстро отправить ему приглашение в группу.
loading.tip.60 = В компактном меню мебели W/S меняют пункт, а новое нажатие E подтверждает выбор.
loading.tip.61 = С приготовленным оружием удерживайте "Приготовить оружие" не менее 0,30 с, чтобы поднять активную защиту.
loading.tip.62 = С приготовленным оружием короткое нажатие "Приготовить оружие" всё ещё убирает его, а удержание включает защиту.
loading.tip.63 = Активная защита работает только спереди: щит закрывает около 120°, оружие 100°, а голые руки 80°.
loading.tip.64 = Обычный блок щитом поглощает примерно 60-90% физического урона до расчёта брони.
loading.tip.65 = Блок оружием или руками слабее щита: он поглощает примерно 35-75% физического урона до брони.
loading.tip.66 = Точное парирование доступно с расчётного навыка защиты 35: поднимайте защиту примерно за 0,10-0,22 с до удара.
loading.tip.67 = Точное парирование может полностью остановить удар, яд на оружии и зачарование при попадании.
loading.tip.68 = Точное парирование ближней атаки прерывает атакующего примерно на 0,55 с.
loading.tip.69 = Удержание активной защиты расходует 4 ед. выносливости в секунду, поэтому защищаться бесконечно не получится.
loading.tip.70 = Сам блок удара тоже расходует выносливость по силе атаки; щит обходится дешевле оружия или рук.
loading.tip.71 = При нехватке выносливости защита может сорваться: поглощение ослабнет, а персонаж прервётся примерно на 0,65 с.
loading.tip.72 = После опускания активной защиты нужно подождать около 0,45 с, прежде чем поднять её снова.
loading.tip.73 = Обычный блок изнашивает защитный предмет, а точное парирование не расходует его прочность.
loading.tip.74 = Щит может блокировать физические снаряды; оружию и рукам для этого нужен очень высокий навык и точное парирование.
loading.tip.75 = Лук и арбалет не служат для блока в Active Guard: для защитной стойки смените экипировку.
loading.tip.76 = Защита оружием использует 65% навыка оружия и 35% Блока; щит использует навык Блок напрямую.
loading.tip.77 = Защита руками использует Рукопашный бой; для парирования вооружённого удара руками нужен очень высокий навык.
loading.tip.78 = Сила влияет на урон рукопашных ударов по здоровью: прокачанный боец бьёт кулаками заметно сильнее.
loading.tip.79 = Урон оружия растёт от нужных характеристик и навыка, но броня цели и состояние оружия всё ещё важны.
loading.tip.80 = За убийство существ физическими атаками тоже начисляется XP: учитываются луки, кулаки, копья, топоры и другое оружие.
loading.tip.81 = Постоянный фарм одного и того же существа даёт всё меньше XP за убийство; выгоднее менять цели.
loading.tip.82 = На более высоких уровнях сложности награда XP тоже выше, компенсируя более тяжёлые бои и выживание.
loading.tip.83 = Смерть снимает незакреплённый XP внутри текущего уровня, но не отнимает уровни, очки навыков и уже поднятые навыки.
loading.tip.84 = Каждая новая стадия квеста может один раз дать XP, а завершение квеста добавляет отдельную награду.
loading.tip.85 = За исследование мира можно получить XP путешествия, но одна и та же точка имеет длительный кулдаун против фарма дверями.
loading.tip.86 = Первое чтение книг может дать XP; книги навыков при этом сохраняют свой прямой эффект на навык.
loading.tip.87 = Естественный реген магии архетипа ограничен 5 ед./с вне боя и 1,75 ед./с во время боя.
loading.tip.88 = "Задержка магии" отключает естественный реген архетипа, но обычные источники "Восстановить магию" работают по своим правилам.
loading.tip.89 = Отражение принадлежит цели заклинания: ваше собственное Reflect не считается отражением, надетым на врага.
loading.tip.90 = Уже отражённое заклинание не может отразиться второй раз, поэтому бесконечной переброски между персонажами нет.
loading.tip.91 = Поглощение заклинаний может остановить ваш отражённый каст, но магию за собственное отражённое заклинание не вернёт.
loading.tip.92 = У многоэффектного заклинания поглощение возвращает стоимость каста не более одного раза, а не за каждый эффект.
loading.tip.93 = Яд на оружии считается алхимией: Reflect и Поглощение заклинаний его не отражают и не поглощают.
loading.tip.94 = Сильные контролирующие эффекты зачарований в PvP могут требовать нескольких попаданий; прямой урон этим стеком не задерживается.
loading.tip.95 = Опытные NPC умеют читать замах, отходить или уклоняться в сторону и отвечать контратакой в появившееся окно.
loading.tip.96 = Ближние NPC сильнее давят на цель в дистанции удара, поэтому бесконечное кружение рядом работает хуже.
loading.tip.97 = Ближайшие враги могут пройти за вами через телепорт-дверь, но погоня ограничена расстоянием, числом врагов и переходов.
loading.tip.98 = Если скрытность действительно разорвала обнаружение, враги некоторое время ищут по последнему движению, а не забывают вас сразу.
loading.tip.99 = Сильно уступающий противнику NPC, если он не стражник, может обратиться в бегство и попытаться найти стражу.
loading.tip.100 = Правила дружественного огня задаёт сервер: изменить их только локальным конфигом клиента нельзя.
loading.tip.101 = Авторские квестовые предметы могут быть персональными: каждый персонаж получает право забрать свою копию из одного источника.
loading.tip.102 = Если другой игрок забрал персональный квестовый предмет, источник остаётся для тех, кто ещё не получал свою копию.
loading.tip.103 = Выброшенный персональный квестовый предмет не превращается в бесконечный источник новых копий.
loading.tip.104 = Обработка голоса умеет подавлять эхо и шум и выравнивать громкость; изменение этих опций требует перезапуска.
loading.tip.105 = Во время передачи голоса звуки игры по умолчанию сильно приглушаются, чтобы речь не тонула в музыке и эффектах.
loading.tip.106 = Громкость голосового чата регулируется отдельно от голосов NPC и диалогов — их можно сбалансировать независимо.
loading.tip.107 = У чата есть несколько режимов отображения; по умолчанию F2 циклически меняет обычный вид, редактор, прозрачность, автоскрытие и скрытие.
loading.tip.108 = По умолчанию удержание клавиши Say около 0,35 с открывает меню игрока, а короткое нажатие оставляет компактный ввод чата.
loading.tip.109 = Требования экипировки задаются сервером, поэтому снизить их только в локальных настройках клиента не получится.
loading.tip.110 = Автоматические требования экипировки считаются по базовым характеристикам предмета; текущий износ не снижает требования.
loading.tip.111 = Более мощное оружие и броня могут требовать высоких навыков или характеристик — развитие влияет на доступную экипировку.
loading.tip.112 = Для книг навыков действует ограничение по уровню, поэтому читать все обучающие книги сразу не всегда выгодно.
loading.tip.113 = Длинные клинки могут использовать Ловкость в формуле урона ArenaMP, поэтому ловкий мечник отличается от бойца с дробящим оружием.
loading.tip.114 = Двуручное оружие получает штраф к точности: большая дальность и урон имеют свою цену.
loading.tip.115 = Посохи вместо обычного штрафа двуручного оружия получают бонус к точности.
loading.tip.116 = Боевые NPC выбирают наиболее сильный доступный тип атаки, а не зависят от случайного направления своего движения.
loading.tip.117 = Боевой ИИ охотнее использует магию, чем ванильный, и раньше начинает рассматривать лечение при падении здоровья.
loading.tip.118 = NPC обходят столкновения и уступают дорогу, помогая группе проходить интерьеры без изменения дальности попаданий оружия.
loading.tip.119 = Защищённая вода определяется автоматически: в бассейнах и бухтах меньше волн, пены и каустики, чем на открытой воде.
loading.tip.120 = При запуске игры показываются сплеши. При переходе между локациями Android использует чёрный фон, а ПК — снимок игровой сцены.

