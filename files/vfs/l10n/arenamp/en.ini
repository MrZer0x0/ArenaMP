chargen.tutorial.text = #E8C878WELCOME TO ARENAMP#FFFFFF\nArenaMP is multiplayer Morrowind built on TES3MP/EncoreMP with newer OpenMW work integrated. It is more than basic co-op: the server synchronizes players, combat, many world objects, quest state and ArenaMP-specific systems.\nExact rules may vary by server. When a local setting conflicts with a server-enforced rule, the server wins.\n\n#E8C878GETTING STARTED#FFFFFF\nCreate your character: choose race and appearance, then class and birthsign. Race details show starting attributes, skills and abilities.\nYour class defines specialization, favored attributes and skill focus. The favored-attribute pair also determines an ArenaMP archetype with strengths and trade-offs.\nAfter creation, check controls, voice and UI. For co-op, open the Player Menu and create or join a party.\n\n#E8C878PROGRESSION, XP AND LEVELS#FFFFFF\nArenaMP uses server-side progression. Supported gameplay actions, exploration, quest stages, kills and other sources award XP. Leveling does not require sleep.\nLevels award development points while skills can still improve through use. Repeatedly farming the same target becomes less rewarding.\nDeath may remove unbanked XP inside the current level, but already earned levels and learned skills remain.\nFatigue matters: low fatigue reduces player physical and spell damage and is also consumed by Active Guard.\n\n#E8C878SERVER AUTHORITY AND ANTI-CHEAT#FFFFFF\nCore stats, progression and part of the combat rules are checked by the server. Local value edits should not grant an advantage: when state disagrees, the server uses the last trusted state.\nAnti-cheat is meant to be quiet protection rather than a stream of technical popups. If progression looks wrong after an update, reconnect and include logs in the bug report.\n\n#E8C878COMBAT BALANCE#FFFFFF\nIn PvE, each strike or offensive spell application may deal at most 10-60% of the target's maximum health, depending on the difference between attacker and target levels. Equal level: 35%; attacker 50 levels lower: 10%; attacker 50 levels higher: 60%. The rule also works for NPCs and creatures attacking a player.\nA single spell shares one damage budget across all its health-damaging effects and their entire duration. A physical hit also shares its budget with on-strike enchantment, poison and class elemental damage.\nThese are only damage ceilings: weapon power, skill, stamina, armour, elemental resistance, creature defence and combos still determine actual damage. Wounded enemies can still be finished; PvP uses a separate rule.\nCreatures attack at a speed set by their level: from 0.5x for the weakest to 1.5x at level 50, with correspondingly shorter pauses between attacks. NPCs and players are not affected.\nLight and Sanctuary give a chance to dodge a physical hit or an arrow completely: 0.6% per point of Light and 1% per point of Sanctuary, at most 35% together. Fatigue lowers the chance, and you cannot dodge while knocked down or paralysed. Spells cannot be dodged.\n\n#E8C878WEAPONS, ACTIVE GUARD AND PARRY#FFFFFF\nKeys below use the default PC layout and can be rebound.\nTap F to draw or sheathe. Hold F with suitable equipment to raise Active Guard. Bows and crossbows are not shields.\nShields block more efficiently than weapons or bare hands. A correctly timed parry needs sufficient skill but can completely stop a physical hit, poison and on-strike enchantment.\nGuarding works in front of the character and consumes fatigue. Heavy blocks can create a short vulnerable window. Skilled NPCs can retreat, sidestep, pursue and counterattack.\nEven without a raised guard, a drawn shield or weapon now and then blocks a hit by itself. The chance grows with defence, i.e. skill (Block; for a weapon, the weapon skill together with Block) and armour rating: up to 25% with a shield, 15% with a weapon and 8% bare-handed. Such a block is weaker than a raised one: it is never a timed parry, costs fatigue, only works in front and not while you are attacking. Only a shield stops arrows by itself.\n\n#E8C878MAGIC#FFFFFF\nSelect a spell or enchanted item. Tap R with a free left hand for a left-hand quick cast. A shield, torch or drawn two-handed weapon can prevent it.\nTimed spells, potions, buffs and debuffs appear in the right-side stack above stamina. Their cards remain until the effect ends and the remaining time updates continuously.\nHold R to prepare magic. Prepared magic uses the normal casting stance. Pressing R again can lower prepared magic after the current action finishes.\nReflect belongs to the spell target. An already reflected effect cannot bounce forever. Spell Absorption can stop a reflected effect without creating an infinite Magicka loop.\nFrom about level 30, magic-specialist NPCs may gain an innate chance to reflect harmful spells; the chance grows with level and combines with normal Reflect sources.\n\n#E8C878SUMMONING AND BOUND GEAR#FFFFFF\nYou can maintain between 1 and 10 summoned creatures. Limit = 1 + floor(9 x min(base Intelligence, base Conjuration) / 100), capped at 10.\nTemporary buffs do not raise the limit. If all slots are occupied, a new summon can wait for a free slot only while its original effect remains active.\nSummoned creatures deal 80% of their normal physical and direct spell damage, so summons stay useful without fully replacing the player.\nBound weapons and armour cannot be dropped, transferred or stored: they are temporary equipment.\n\n#E8C878PARTIES AND CO-OP#FFFFFF\nThe party menu supports invites, kicks and leadership transfer. Some systems can separately synchronize journal state and dialogue topics.\nXP from eligible shared actions can be distributed among party members in the same cell. Party markers can be shown on the map.\nAccept party and synchronization actions deliberately because they can affect shared progression.\n\n#E8C878VOICE CHAT#FFFFFF\nLocal voice is for nearby players; the default PC key is V. Party voice connects party members regardless of distance.\nOn Android the microphone button acts as a toggle. A thin green frame indicates active transmission.\nSettings include voice volume, self microphone gain and voice processing. Game audio can automatically duck while you speak.\n\n#E8C878CHAT AND PLAYER MENU#FFFFFF\nChat supports several communication modes including local RP/OOC-style Say, Whisper and Shout.\nBy default, tapping Y opens compact chat input and holding Y opens the Player Menu. The menu exposes players, party, profile, housing and other server systems.\n\n#E8C878SERVER LIST AND LOCAL HOSTING#FFFFFF\nThe launcher can show published ArenaMP servers and the information supplied by each host. For a private group you can run a local server and choose its name, password, player limit and publication mode.\nIf a server does not appear in the list, it is not necessarily offline: check publication, network reachability and that client/server protocol versions match.\n\n#E8C878HOUSES AND PRIVATE INSTANCES#FFFFFF\nA purchasable house shows its price. By default a player may own one house. A private instance is separated from the public cell so your changes do not have to affect other players.\nOwners manage friends, co-owners, item permissions and other access rules. Trusted characters may receive special access through locked house doors.\nSeveral interiors can belong to one property. Selling follows server cleanup/refund rules.\nBooks and notes in a protected house can be readable without granting theft permission; containers should remain closed when the owner denies access.\n\n#E8C878FURNITURE, DECORATION AND DISPLAYS#FFFFFF\nInside your property, hold activation on supported furniture or items to open actions. You can move, return, delete and manage supported objects according to permissions.\nPlacement mode supports movement, rotation and fine positioning, with Android-specific controls where needed.\nDisplays let owners set a sale price. Priced or personally locked items cannot be taken normally until the relevant restriction is removed. Sale proceeds are stored separately.\n\n#E8C878QUESTS AND PERSONAL QUEST ITEMS#FFFFFF\nArenaMP tries to preserve quest play in multiplayer. Some important quest items can be personal: if another player took their copy, the source can remain for players who have not received theirs.\nDropping a personal quest item is not intended to create infinite copies. Some scripts and quests can still behave differently from single-player Morrowind.\n\n#E8C878TRADING, ITEMS AND WRITING#FFFFFF\nTrading depends on skills, disposition and server rules. Check prices before confirming a deal.\nArenaMP includes a writing system for player-created books and scrolls when the required materials are available. Created texts can be read, copied and edited according to the system rules.\nEquipment requirements and several combat coefficients are server-enforced and cannot be bypassed with a local settings.cfg.\n\n#E8C878ECONOMY AND XP ABUSE PROTECTION#FFFFFF\nThe server tracks selected repeated actions so the same container, quest item or artificially returned object cannot be farmed forever for XP or duplicate copies.\nIf an action only looks profitable because of desynchronization, do not assume the result will persist: authoritative server state wins.\n\n#E8C878UNCONSCIOUSNESS, DEATH AND REVIVE#FFFFFF\nAn unconscious ally can be revived with suitable Restore Health support. In some cases your own healing potion can also bring you back. Revive abuse is limited by a lockout.\nA high bounty can increase the respawn wait. Reconnecting is not intended to bypass server timers.\n\n#E8C878CONNECTION AND RECOVERY#FFFFFF\nAfter a short disconnect ArenaMP attempts to restore the connection for roughly 30 seconds and shows progress. Avoid closing the game if you want the current session to recover.\nOn PC, cell transitions can keep the last gameplay frame visible with a loading bar. Android uses a safe black transition to reduce mobile rendering and memory issues.\n\n#E8C878CAMERA, INVENTORY AND ANDROID#FFFFFF\nTap TAB to switch perspective. Holding TAB in third person is used for supported character-orbit camera behaviour.\nUse the inventory for equipment, magic and consumables. Android provides on-screen controls and a control editor.\nIf cursor or UI behaviour feels uncomfortable, check control settings and UI scale first.\n\n#E8C878INTERFACE AND HUD#FFFFFF\nOther players show their name without a level; level information is reserved for NPCs and creatures. Combat health bars help track targets, and close targets can move into a compact stack near the lower HUD.\nThe right-side feed above stamina shows pickups, XP and timed magic effects. A timed effect does not disappear early: its remaining seconds update until it expires or is dispelled.\nLoading tips summarize controls and server mechanics, but this tutorial is the fuller reference.\n\n#E8C878SERVER RULES AND PROGRESSION PROTECTION#FFFFFF\nCritical stats, progression and parts of combat are server-validated. Local file edits are not a reliable way to strengthen a character: server-enforced values take priority and may restore the last trusted state.\nArenaMP tries to keep these checks unobtrusive during normal play. If an update leaves something inconsistent, restart the client and attach logs to a bug report.\n\n#E8C878PERFORMANCE#FFFFFF\nArenaMP adds effects, animation, voice and network synchronization. If FPS is unstable, start with view distance, shadows, grass, material quality and post-processing.\nAvoid unnecessarily raising mobile memory limits: Android behaviour depends heavily on GPU and available RAM.\n\n#E8C878HELP AND BUG REPORTS#FFFFFF\nHelp and community: t.me/arena_mp\nWhen reporting a bug include platform, client version, server, reproduction steps and expected result. If possible attach tes3mp-client.log, a server log or screenshot.\nNever publish passwords, tokens or other private information.


