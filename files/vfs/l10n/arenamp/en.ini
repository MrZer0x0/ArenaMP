settings.tooltip.land_optimization = Dynamically adjusts outdoor distance. When enabled, a 4,000–40,000 target-distance slider links world, shadow and grass ranges. If FPS falls below the selected target, the engine can gradually reduce all three distances to 50% and restore them when performance recovers.
settings.tooltip.optimized_distance = Selects the preferred maximum outdoor distance. Shadows use 25% and grass uses 40% of this value. Adaptive optimization may temporarily reduce the effective distance by up to half without changing the selected target.
