settings.tooltip.max_lights = Default: 8\nMaximum number of lights per object.\n\nValues near the default may cause visible light popping similar to legacy lighting.
settings.tooltip.max_light_distance = Default: 8192 units\nMaximum distance at which lights appear.\n\nSet to 0 to disable the distance limit.
settings.tooltip.light_fade = Default: 0.85\nFraction of the maximum distance where lights begin to fade.\n\nLower values create slower transitions; higher values create quicker transitions.
settings.tooltip.light_bounds = Default: 1.65\nMultiplier for light bounding spheres. Higher values provide smoother falloff but may require more maximum lights.\n\nThis does not change light strength.
settings.tooltip.minimum_brightness = Default: 0.08\nMinimum ambient brightness in interiors.\n\nIncrease this when interiors appear too dark.
settings.tooltip.material_quality = Changes normal maps, specular maps and parallax without restarting. None disables material maps; Simple enables normal maps; Balanced adds specular maps and lightweight parallax; Quality enables POM and self-shadowing; Ultra enables maximum POM, cavity AO and PBR-compatible GGX highlights. Ultra requires High or Ultra terrain detail; choosing it raises terrain detail automatically, while lowering terrain detail switches PBR back to Quality.
