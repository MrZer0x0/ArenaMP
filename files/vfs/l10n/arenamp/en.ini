loading.tip.1 = Your magic school skill affects spell creation prices, so develop the schools you actually use.
loading.tip.2 = In a multi-effect spell, the price is calculated separately for every effect.
loading.tip.3 = Effect magnitude, duration and area directly increase a spell's creation cost.
loading.tip.4 = Footprints depend on the surface under your feet and gradually fade away.
loading.tip.5 = Changing the interface language also changes the language of loading tips.
loading.tip.6 = A vacant home can be purchased by holding Take/Activate on its door.
loading.tip.7 = A short door press remains a normal entry; holding it invokes the property system.
loading.tip.8 = Your property is managed from the My Home tab in the Player Menu.
loading.tip.9 = An owner can rename a property and choose its type: home, tavern, shop or guild hall.
loading.tip.10 = A co-owner can decorate the home and manage items without becoming the new owner.
loading.tip.11 = Friends can be granted home access without receiving co-owner permissions.
loading.tip.12 = The owner can separately allow or forbid guests from taking items.
loading.tip.13 = Owners, co-owners and friends are trusted and may enter through the home's locked door.
loading.tip.14 = A private home instance is separate from the shared cell, so your changes do not affect other players.
loading.tip.15 = After 30 account days, containers in your own home can work without a capacity limit.
loading.tip.16 = Selling a property returns only part of its purchase value.
loading.tip.17 = Hold Take on a portable item in your property to open its action menu.
loading.tip.18 = Property items can be moved, priced, taken into inventory or protected with a personal lock.
loading.tip.19 = A display price covers the whole item or stack, not a single unit.
loading.tip.20 = Only the property owner can set or remove a sale price from a displayed item.
loading.tip.21 = A buyer confirms a displayed-item purchase with a normal activation.
loading.tip.22 = You cannot take back your own listed item until its price is removed.
loading.tip.23 = A locked item cannot be moved or purchased; remove its personal lock first.
loading.tip.24 = Sale proceeds are stored separately and can be collected with the Proceeds button.
loading.tip.25 = After a home is transferred, old prices do not keep paying the previous owner.
loading.tip.26 = The furniture shop is available from the Decorations menu and keeps purchased furniture separately.
loading.tip.27 = The owner and co-owners can place and remove furniture in an eligible home.
loading.tip.28 = Holding Take on furniture opens a compact menu for moving, packing or deleting it.
loading.tip.29 = A short Take press does not start editing: chests, beds and loose items keep their normal behavior.
loading.tip.30 = While placing an object, movement keys move it and Shift enables fine adjustment.
loading.tip.31 = Hold the Ready Weapon button while placing an object to rotate it.
loading.tip.32 = The Ready Magic button cycles the placement rotation axis X - Y - Z.
loading.tip.33 = The mouse wheel changes object distance; the middle button changes the view.
loading.tip.34 = Ctrl aligns an object in front of you, while surface snapping helps place it cleanly.
loading.tip.35 = Press Take/Activate again to finish placing the object.
loading.tip.36 = You can create and manage a group directly from the Player Menu.
loading.tip.37 = A group leader can invite players, remove members and transfer leadership.
loading.tip.38 = Kill and quest XP is shared among online group members who are in the same cell.
loading.tip.39 = Group journal synchronization can be enabled or disabled independently.
loading.tip.40 = Group dialogue-topic synchronization can also be toggled independently.
loading.tip.41 = Group Voice connects members of your group regardless of the distance between them.
loading.tip.42 = Even with Group Voice enabled, V remains local voice for nearby players.
loading.tip.43 = The Group Voice channel state is remembered between game sessions.
loading.tip.44 = On Android, the microphone is a toggle: tap once to enable it and again to disable it.
loading.tip.45 = While transmitting voice, a thin green frame shows that your microphone is active.
loading.tip.46 = An unconscious group member can be revived with a Restore Health potion.
loading.tip.47 = A touch-range Restore Health spell can also revive an unconscious group member.
loading.tip.48 = If you are unconscious, your own Restore Health potions can let you recover by yourself.
loading.tip.49 = With a personal bounty of at least 1000, death clears it and adds waiting time per full thousand.
loading.tip.50 = The bounty respawn timer runs only while you are online; reconnecting does not reset it.
loading.tip.51 = You can enable group-member marker visibility on the map.
loading.tip.52 = Y: tap for quick chat input; hold it to open the Player Menu.
loading.tip.53 = Chat supports RP/OOC and local Say, Whisper and Shout modes.
loading.tip.54 = An archetype grows stronger as its two primary attributes increase.
loading.tip.55 = Archetypes have bonuses and conditional penalties, so match them to your gear and play style.
loading.tip.56 = Some trainers have a training limit that lasts until the server restarts.
loading.tip.57 = Your profile contains return points that unlock progressively as your level increases.
loading.tip.58 = The profile menu shows play time, deaths, arrests, level and return points.
loading.tip.59 = In the Players menu you can select a character and quickly send a group invitation.
loading.tip.60 = In the compact furniture menu, W/S changes the row and a new E press confirms the choice.
loading.tip.61 = With a weapon drawn, hold Ready Weapon for at least 0.30 seconds to raise Active Guard.
loading.tip.62 = With a weapon drawn, a short Ready Weapon tap still sheathes it; a hold becomes guard instead.
loading.tip.63 = Active Guard protects only the front: shields cover about 120 degrees, weapons 100, and bare hands 80.
loading.tip.64 = A normal shield block absorbs roughly 60-90% of physical damage before armor is applied.
loading.tip.65 = Blocking with a weapon or bare hands absorbs less than a shield: roughly 35-75% before armor.
loading.tip.66 = Precise parry unlocks from calculated guard skill 35; time the guard raise about 0.10-0.22 seconds before impact.
loading.tip.67 = A precise parry can completely stop the hit, its weapon poison and its on-strike enchantment.
loading.tip.68 = Precisely parrying a melee attack interrupts the attacker for about 0.55 seconds.
loading.tip.69 = Holding Active Guard drains 4 Fatigue per second, so defending forever is not free.
loading.tip.70 = Blocking a hit also costs Fatigue based on incoming damage; shields are cheaper than weapons or bare hands.
loading.tip.71 = If your Fatigue is too low, guard can break: protection weakens and you are interrupted for about 0.65 seconds.
loading.tip.72 = After lowering Active Guard, there is a short 0.45-second delay before you can raise it again.
loading.tip.73 = Normal blocking wears the blocking item; a precise parry does not damage its durability.
loading.tip.74 = A shield can block physical projectiles; weapons or bare hands need very high guard skill and a precise parry.
loading.tip.75 = Bows and crossbows are not blocking tools in Active Guard: switch equipment if you want a defensive stance.
loading.tip.76 = Weapon guarding uses 65% of that weapon skill plus 35% of Block; shield guarding uses Block directly.
loading.tip.77 = Bare-hand guarding uses Hand-to-Hand; parrying an armed strike bare-handed requires very high Hand-to-Hand skill.
loading.tip.78 = Strength contributes to unarmed health damage, so a trained brawler hits harder than a weak one.
loading.tip.79 = Weapon damage grows with the relevant attributes and weapon skill, while armor and weapon condition still matter.
loading.tip.80 = Physical kills on creatures reward kill XP too: bows, fists, spears, axes and other weapons all count.
loading.tip.81 = Repeatedly farming the same creature gives diminishing kill XP; changing targets is more efficient.
loading.tip.82 = Higher difficulty tiers also increase XP rewards, compensating for tougher fights and survival.
loading.tip.83 = Death removes unbanked XP inside the current level, but never takes away earned levels, Skill Points or skills.
loading.tip.84 = Each newly reached quest journal stage can award XP once, and quest completion adds its own bonus.
loading.tip.85 = Exploration can award travel XP, but the same travel window has a persistent cooldown to prevent door-loop farming.
loading.tip.86 = The first read of books can award XP; skill books keep their direct skill effect as well.
loading.tip.87 = Archetype natural Magicka regeneration is capped at 5 points per second outside combat and 1.75 in combat.
loading.tip.88 = Stunted Magicka disables archetype natural Magicka regeneration, but normal Restore Magicka sources still follow their own rules.
loading.tip.89 = Reflect belongs to the target being hit by a spell; your own Reflect does not act as if it were on the enemy.
loading.tip.90 = A spell that has already been reflected cannot reflect again, preventing endless reflection loops.
loading.tip.91 = Spell Absorption can stop your own reflected spell, but it will not refund Magicka from that reflected cast.
loading.tip.92 = For a multi-effect spell, Spell Absorption can refund the spell cost only once per cast, not once per effect.
loading.tip.93 = Weapon poison is delivered as alchemy: Reflect and Spell Absorption do not bounce or absorb it.
loading.tip.94 = Heavy on-strike control effects in PvP may require several hits to trigger; direct damage effects are never delayed by that stack.
loading.tip.95 = Skilled NPCs can read incoming swings, sidestep or hop back, then counter during the opening.
loading.tip.96 = Melee NPCs commit more strongly once in striking range, so repeated circling is less effective at close distance.
loading.tip.97 = Nearby hostile actors can pursue you through teleport doors, but pursuit has distance, count and transition limits.
loading.tip.98 = If stealth truly breaks detection, enemies may search your last movement for a while instead of forgetting you instantly.
loading.tip.99 = A badly outmatched non-guard NPC may flee and can try to seek a nearby guard instead of fighting to the death.
loading.tip.100 = Friendly-fire rules are server-enforced; changing a local configuration cannot bypass the server policy.
loading.tip.101 = Authored quest items can be personal: each character may claim their own copy from the same world source.
loading.tip.102 = When another player takes a personal quest item, its source stays available to characters who have not claimed it yet.
loading.tip.103 = Dropping a personal quest item does not turn it into an infinite source of new quest-item copies.
loading.tip.104 = Voice processing can use echo cancellation, noise suppression and normalization; changes to these options require a restart.
loading.tip.105 = While you transmit voice, the game audio is heavily ducked by default so speech remains clear over music and effects.
loading.tip.106 = Voice-chat volume is separate from NPC/dialogue voice volume, so you can balance players and game voices independently.
loading.tip.107 = The chat HUD has several display modes; the default F2 binding cycles visible, edit, transparency, autohide and hidden states.
loading.tip.108 = By default, holding the Say key for about 0.35 seconds opens the Player Menu; a quick tap keeps chat input compact.
loading.tip.109 = Equipment requirements are enforced by the server, so lowering them only in your local settings will not help.
loading.tip.110 = Automatic equipment requirements use the item's real base stats; current durability does not lower the requirement.
loading.tip.111 = Stronger weapons and armor can demand higher skills or attributes, so progression affects what gear you can use effectively.
loading.tip.112 = Skill books have a level-limit rule, so reading every training book immediately is not always the best plan.
loading.tip.113 = Long blades can use Agility for ArenaMP damage scaling, making an agile swordsman different from a blunt-weapon bruiser.
loading.tip.114 = Two-handed weapons carry an accuracy penalty, so their reach and damage come with a tradeoff.
loading.tip.115 = Staves use an accuracy bonus instead of the usual two-handed accuracy penalty.
loading.tip.116 = Combat NPCs prefer their strongest available attack type instead of blindly using the direction they happen to move.
loading.tip.117 = Combat AI favors magic more than vanilla and starts considering healing earlier when health becomes low.
loading.tip.118 = NPCs avoid collisions and can give way, helping groups move through interiors without changing weapon hit detection.
loading.tip.119 = Sheltered water is detected automatically: pools and coves use calmer waves, less foam and weaker caustics than open water.
loading.tip.120 = Startup loading shows splash screens. Cell transitions use a black background on Android and a scene snapshot on desktop.

